<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="cover.css">
<style>
body { width:1080px; height:1920px; }
.brand { position:absolute; left:80px; top:150px; }
.brand img { width:104px; height:104px; }
.brand b { font-size:42px; } .brand span { font-size:26px; }
.wrap { position:absolute; left:80px; top:360px; right:80px; }
.num { font-size:330px; letter-spacing:-12px; }
.title { font-size:112px; margin-top:16px; }
.sub { font-size:40px; margin-top:26px; }
.bars { position:absolute; left:80px; right:80px; top:1060px; gap:20px; }
.row .lab { width:150px; font-size:30px; }
.row .v { width:160px; font-size:32px; }
.track, .rest { height:70px; }
.seg { font-size:28px; padding-left:16px; }
.chips { position:absolute; left:80px; top:1270px; display:flex; gap:18px; }
.chip { padding:14px 28px; border-radius:999px; border:2px solid rgba(74,135,250,.7); color:#E4ECFB; font-size:32px; font-weight:600; background:rgba(41,107,245,.16); }
.face { width:340px; height:340px; right:90px; bottom:170px; }
.en { position:absolute; left:80px; bottom:200px; font-size:28px; }
</style></head><body>
<div class="brand"><img src="icon.png"><div><b>MacSweeper</b><span>免费开源的 Mac 清理工具</span></div></div>
<div class="wrap">
  <div class="num">82<small>GB</small></div>
  <div class="title">全是浏览器缓存</div>
  <div class="sub">我 Mac 上最占地方的三样东西</div>
</div>
<div class="bars">
  <div class="row"><div class="lab">三样缓存</div><div class="track"><div class="seg s1" style="flex:34">飞书 34</div><div class="seg s2" style="flex:26">Chrome 26</div><div class="seg s3" style="flex:22">微信 22</div></div><div class="v">82 GB</div></div>
  <div class="row"><div class="lab">硬盘剩余</div><div style="flex:1;display:flex"><div class="rest" style="flex:79.7"></div><div style="flex:2.3"></div></div><div class="v">79.7 GB</div></div>
</div>
<div class="chips"><div class="chip">只进废纸篓</div><div class="chip">一键撤销</div><div class="chip">不上传</div></div>
<div class="en">Free &amp; open-source Mac cleaner</div>
<img class="face" src="face.png">
</body></html>
